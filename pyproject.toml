[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursegit"
version = "0.1.0"
description = "A curses Git client in Python: stage, commit, pull, push, branches, stashes, log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.scripts]
cursegit = "cursegit.__main__:main"

[tool.setuptools.packages.find]
include = ["cursegit*"]
